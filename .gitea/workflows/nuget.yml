name: Publish NuGet.org

# Gitea Actions (runner Windows "vip-windows": o DANFE usa System.Drawing.Common, suportado só no Windows a partir do .NET 7).
# Requer o secret NUGET_TOKEN no repositório.
# Versão: 1.2.<run_number> (o contador do Gitea começa em 1; 1.1.x foi a série publicada pelo GitHub Actions).

on:
  workflow_dispatch:
    inputs:
      typeBuild:
        description: "É beta? (digite -beta)"
        required: false

jobs:
  deploy-package:
    runs-on: vip-windows

    defaults:
      run:
        shell: powershell

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Definir versão"
        id: envs
        run: |
          Add-Content -Path $env:GITHUB_OUTPUT -Value "VERSION_PROJECT=1.2.${{ github.run_number }}"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "VERSION_PACKAGE=1.2.${{ github.run_number }}${{ github.event.inputs.typeBuild }}"

      - name: "Exibir versão"
        run: |
          echo "Version: ${{ steps.envs.outputs.VERSION_PROJECT }}"
          echo "Package: ${{ steps.envs.outputs.VERSION_PACKAGE }}"

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: "Restore"
        run: dotnet restore src/Vip.DFe.Tests/Vip.DFe.Tests.csproj

      - name: "Build"
        run: dotnet build src/Vip.DFe.Tests/Vip.DFe.Tests.csproj -c Release --no-restore -p:Version=${{ steps.envs.outputs.VERSION_PROJECT }}

      - name: "Test"
        run: dotnet test src/Vip.DFe.Tests/Vip.DFe.Tests.csproj -c Release --no-build

      - name: "Pack"
        run: >
          dotnet pack src/Vip.DFe/Vip.DFe.csproj -c Release -o artifacts
          -p:Version=${{ steps.envs.outputs.VERSION_PROJECT }}
          -p:PackageVersion=${{ steps.envs.outputs.VERSION_PACKAGE }}

      - name: "Publish"
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_TOKEN }}
          --skip-duplicate
