name: CI

# Gitea Actions (runner Linux "vip-linux"). Compila e testa apenas a lib e os testes;
# a Demo (WinForms .NET Framework 4.8) exige Windows/MSBuild e não é compilada aqui.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: vip-linux

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: "Restore"
        run: dotnet restore src/Vip.DFe.Tests/Vip.DFe.Tests.csproj

      - name: "Build"
        run: dotnet build src/Vip.DFe.Tests/Vip.DFe.Tests.csproj -c Release --no-restore

      - name: "Test"
        run: dotnet test src/Vip.DFe.Tests/Vip.DFe.Tests.csproj -c Release --no-build --verbosity normal
