name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: "Restore Dependencies"
        run: nuget restore .\src\Vip.DFe.sln

      - name: "Build Solution"
        run: msbuild .\src\Vip.DFe.sln /p:Configuration=Release

      - name: "Test Project"
        run: dotnet vstest src\Vip.DFe.Tests\bin\Release\net8.0\Vip.DFe.Tests.dll
