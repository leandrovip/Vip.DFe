name: Publish NuGet.org

on:
  workflow_dispatch:
    inputs:
      typeBuild:
        description: "É beta? (digite -beta)"
        required: false

jobs:
  deploy-package:
    runs-on: windows-latest

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v4

      - name: "Set Variables"
        id: envs
        run: |
          "VERSION_PROJECT=1.1.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          "VERSION_PACKAGE=1.1.${{ github.run_number }}${{ github.event.inputs.typeBuild }}" >> $env:GITHUB_OUTPUT

      - name: "Variables Test"
        run: |
          echo Version: ${{ steps.envs.outputs.VERSION_PROJECT }}
          echo Version2: ${{ steps.envs.outputs.VERSION_PACKAGE }}

      - name: "Force nuget source"
        uses: fabriciomurta/ensure-nuget-source@v1
        with:
          name: "nuget.org"
          url: "https://api.nuget.org/v3/index.json"

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: "Clean Solution"
        run: |
          msbuild .\src\Vip.DFe.sln /t:Clean /p:Configuration=Release
          nuget locals all -clear

      - name: "Restore Dependencies"
        run: nuget restore .\src\Vip.DFe.sln

      - name: "Build Solution"
        run: msbuild .\src\Vip.DFe.sln /p:Configuration=Release /p:Version=${{ steps.envs.outputs.VERSION_PROJECT }}

      - name: "Test Project"
        run: dotnet vstest src\Vip.DFe.Tests\bin\Release\net8.0\Vip.DFe.Tests.dll

      - name: "Create Package"
        run: msbuild .\src\Vip.DFe\Vip.DFe.csproj /t:Pack /p:Configuration=Release /p:Version=${{ steps.envs.outputs.VERSION_PROJECT }} /p:PackageVersion=${{ steps.envs.outputs.VERSION_PACKAGE }}

      - name: "Publish Package"
        run: nuget push .\src\Vip.DFe\bin\Release\*.nupkg -Source https://api.nuget.org/v3/index.json -ApiKey ${{ secrets.NUGET_TOKEN }}
