name: Publish NuGet.org

# Publicação do pacote Vip.DFe no nuget.org via Trusted Publishing (OIDC), sem API key.
# Roda SOMENTE no mirror GitHub (leandrovip/Vip.DFe): o Trusted Publishing do nuget.org não aceita Gitea.
# O repositório de origem é o Gitea; o CI fica em .gitea/workflows/ci.yml (o Gitea ignora .github/workflows).
#
# Pré-requisitos:
#   - nuget.org → Trusted Publishing: política com Owner "leandrovip", Repository "Vip.DFe", Workflow File "nuget.yml".
#   - GitHub → Settings → Secrets: NUGET_USER = nome do perfil no nuget.org (não o e-mail).
#   - workflow_dispatch só aparece/roda quando este arquivo existe na branch padrão (master) do GitHub.
#
# Versão: 1.2.<run_number> (+ sufixo opcional, ex.: -beta). Não altere <Version> no csproj.

on:
  workflow_dispatch:
    inputs:
      typeBuild:
        description: "É beta? (digite -beta)"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy-package:
    # Garante que não rode em forks.
    if: github.repository == 'leandrovip/Vip.DFe'
    # Windows: o DANFE usa System.Drawing.Common, suportado só no Windows a partir do .NET 7.
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Definir versão"
        id: envs
        run: |
          "VERSION_PROJECT=1.2.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          "VERSION_PACKAGE=1.2.${{ github.run_number }}${{ github.event.inputs.typeBuild }}" >> $env:GITHUB_OUTPUT

      - name: "Exibir versão"
        run: |
          echo "Version: ${{ steps.envs.outputs.VERSION_PROJECT }}"
          echo "Package: ${{ steps.envs.outputs.VERSION_PACKAGE }}"

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: "Restore"
        run: dotnet restore src/Vip.DFe.Tests/Vip.DFe.Tests.csproj

      - name: "Build"
        run: dotnet build src/Vip.DFe.Tests/Vip.DFe.Tests.csproj -c Release --no-restore -p:Version=${{ steps.envs.outputs.VERSION_PROJECT }}

      - name: "Test"
        run: dotnet test src/Vip.DFe.Tests/Vip.DFe.Tests.csproj -c Release --no-build

      - name: "Pack"
        run: >
          dotnet pack src/Vip.DFe/Vip.DFe.csproj -c Release -o artifacts
          -p:Version=${{ steps.envs.outputs.VERSION_PROJECT }}
          -p:PackageVersion=${{ steps.envs.outputs.VERSION_PACKAGE }}

      - name: "Login no nuget.org (Trusted Publishing)"
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: "Publish"
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
